name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Node.js is never chosen here: each action below brings its own. These versions all run on Node 24 (the older ones, checkout v4,
# setup-python v5, configure-pages v5, upload-pages-artifact v3 and deploy-pages v4, run on Node 20, which GitHub is retiring).
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install pillow numpy scipy   # make_images.py needs Pillow; make_scenes.py also needs numpy and scipy
      - name: Run tests
        run: node --test tests/              # the Worker and the game rules (the runner ships a recent Node)
      - name: Build site
        run: python3 tools/build_all.py      # images -> rule shards -> builds/site (one HTML page per address)
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: builds/site
      - id: deployment
        uses: actions/deploy-pages@v5
