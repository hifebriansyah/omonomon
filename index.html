<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Every address (/, /<slug>/, /<slug>/history/) is built from this file by tools/make_site.py, which
       fills the title, description, canonical link, share tags and structured data at @head and the
       character links at @picker. <base> lets one set of relative paths work at any depth. -->
  <base href="./">
  <title>Omon Omon</title>
  <!-- @head -->
  <!-- Icons: Lucide v1.61.0 (https://lucide.dev), ISC License, Copyright (c) 2026 Lucide Icons and Contributors. -->
  <link rel="icon" href="builds/img/favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="builds/img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b1d23">
  <meta name="apple-mobile-web-app-title" content="Omon Omon">
  <link rel="stylesheet" href="style.css">
  <!-- Fetch every module at once instead of discovering them one import at a time.
       Keep this list in sync with the files in assets/scripts/. -->
  <link rel="modulepreload" href="assets/scripts/main.js">
  <link rel="modulepreload" href="assets/scripts/state.js">
  <link rel="modulepreload" href="assets/scripts/dom.js">
  <link rel="modulepreload" href="assets/scripts/util.js">
  <link rel="modulepreload" href="assets/scripts/rules.js">
  <link rel="modulepreload" href="assets/scripts/replies.js">
  <link rel="modulepreload" href="assets/scripts/storage.js">
  <link rel="modulepreload" href="assets/scripts/stage.js">
  <link rel="modulepreload" href="assets/scripts/chat.js">
  <link rel="modulepreload" href="assets/scripts/composer.js">
  <link rel="modulepreload" href="assets/scripts/router.js">
</head>
<body>
  <main class="comic">
    <header class="top">
      <nav id="picker" class="picker" aria-label="Choose who to chat with"><!-- @picker --></nav>
      <button id="historyBtn" class="hist-btn" type="button" aria-expanded="false" aria-controls="history"
              aria-label="Show chat history" title="Show chat history">
        <span class="hist-circle">
          <svg class="icon icon-history" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
          <svg class="icon icon-close" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </span>
        <span class="hist-label"><span class="lbl-history">History</span><span class="lbl-close">Close</span></span>
      </button>
    </header>

    <section id="stage" class="stage">
      <div class="tag">
        <h1 id="name">&nbsp;</h1>
        <p id="status">&nbsp;</p>
      </div>

      <p id="about" class="sr-only"></p>

      <!-- Screen readers get the full reply at once; the animated bubble is hidden from them. -->
      <div id="sr" class="sr-only" aria-live="polite"></div>
      <div id="bubble" class="bubble" aria-hidden="true">
        <p id="bubbleText"></p>
      </div>

      <img id="hero" class="hero" alt="">

      <div class="you-slot">
        <div id="youBubble" class="bubble you" hidden>
          <p id="youText"></p>
        </div>
      </div>

      <aside id="history" class="history" hidden>
        <div class="history-bar">
          <button id="clearBtn" type="button" aria-label="Clear chat" title="Clear this chat"><svg class="icon icon-trash" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span>Clear</span></button>
        </div>
        <div id="messages" class="messages"></div>
      </aside>
    </section>

    <form id="form" class="composer" autocomplete="off">
      <div class="field">
        <input id="input" type="text" placeholder="Say something..." autofocus>
        <span id="count" class="count" hidden></span>
      </div>
      <button type="submit">Send</button>
    </form>
  </main>

  <script src="config.js"></script>
  <script type="module" src="assets/scripts/main.js"></script>
</body>
</html>
